basePath: /api/v1
definitions:
  model.AchievementDetails:
    properties:
      authors:
        items:
          type: string
        type: array
      certificationName:
        description: Certification
        type: string
      certificationNumber:
        type: string
      competitionLevel:
        type: string
      competitionName:
        description: Competition
        type: string
      eventDate:
        description: General
        type: string
      issn:
        type: string
      issuedBy:
        type: string
      location:
        type: string
      medalType:
        type: string
      organizationName:
        description: Organization
        type: string
      organizer:
        type: string
      period:
        $ref: '#/definitions/model.OrganizationPeriod'
      position:
        type: string
      publicationTitle:
        type: string
      publicationType:
        description: Publication
        type: string
      publisher:
        type: string
      rank:
        type: integer
      score:
        type: number
      validUntil:
        type: string
    type: object
  model.AchievementResponse:
    properties:
      achievement_type:
        type: string
      attachments:
        items:
          $ref: '#/definitions/model.Attachment'
        type: array
      created_at:
        type: string
      description:
        type: string
      details:
        $ref: '#/definitions/model.AchievementDetails'
      id:
        type: string
      mongo_achievement_id:
        type: string
      points:
        type: integer
      rejection_note:
        type: string
      status:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.AssignAdvisorRequest:
    properties:
      lecturer_id:
        type: string
    type: object
  model.Attachment:
    properties:
      fileName:
        type: string
      fileType:
        type: string
      fileUrl:
        type: string
      uploadedAt:
        type: string
    type: object
  model.AttachmentResponse:
    properties:
      filename:
        type: string
      mime_type:
        type: string
      size:
        type: integer
      uploaded_at:
        type: string
      url:
        type: string
    type: object
  model.ChangeRoleRequest:
    properties:
      lecturer:
        $ref: '#/definitions/model.CreateLecturerData'
      role:
        enum:
        - admin
        - mahasiswa
        - dosen_wali
        type: string
      student:
        $ref: '#/definitions/model.CreateStudentData'
    required:
    - role
    type: object
  model.CompetitionRequest:
    properties:
      competition_level:
        type: string
      competition_name:
        type: string
      medal_type:
        type: string
      rank:
        type: integer
    type: object
  model.CreateAchievementRequest:
    properties:
      achievement_type:
        enum:
        - academic
        - competition
        - organization
        - publication
        - certification
        - other
        type: string
      competition_details:
        $ref: '#/definitions/model.CompetitionRequest'
      description:
        type: string
      event_date:
        type: string
      organization_details:
        $ref: '#/definitions/model.OrganizationRequest'
      publication_details:
        $ref: '#/definitions/model.PublicationRequest'
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - achievement_type
    - title
    type: object
  model.CreateLecturerData:
    properties:
      department:
        type: string
    required:
    - department
    type: object
  model.CreateStudentData:
    properties:
      academic_year:
        type: string
      program_study:
        type: string
    required:
    - academic_year
    - program_study
    type: object
  model.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      lecturer:
        $ref: '#/definitions/model.CreateLecturerData'
      password:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - mahasiswa
        - dosen_wali
        type: string
      student:
        $ref: '#/definitions/model.CreateStudentData'
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - role
    - username
    type: object
  model.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  model.LecturerListResponse:
    properties:
      department:
        type: string
      full_name:
        type: string
      id:
        type: string
      lecturer_id:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.LoginResponse:
    properties:
      refreshToken:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/model.LoginUser'
    type: object
  model.LoginSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/model.LoginResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  model.LoginUser:
    properties:
      fullName:
        type: string
      id:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      username:
        type: string
    type: object
  model.MetaInfo:
    properties:
      limit:
        type: integer
      order:
        type: string
      page:
        type: integer
      pages:
        type: integer
      search:
        type: string
      sortBy:
        type: string
      total:
        type: integer
    type: object
  model.OrganizationPeriod:
    properties:
      end:
        type: string
      start:
        type: string
    type: object
  model.OrganizationRequest:
    properties:
      end_date:
        type: string
      organization_name:
        type: string
      position:
        type: string
      start_date:
        type: string
    type: object
  model.ProfileData:
    properties:
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  model.ProfileResponse:
    properties:
      data:
        $ref: '#/definitions/model.ProfileData'
      success:
        type: boolean
    type: object
  model.PublicationRequest:
    properties:
      authors:
        items:
          type: string
        type: array
      issn:
        type: string
      publication_title:
        type: string
      publisher:
        type: string
    type: object
  model.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  model.RefreshTokenResponse:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  model.RejectRequest:
    properties:
      rejection_note:
        type: string
    required:
    - rejection_note
    type: object
  model.StatItem:
    properties:
      count:
        type: integer
      label:
        type: string
    type: object
  model.StatsResponse:
    properties:
      by_competition_level:
        items:
          $ref: '#/definitions/model.StatItem'
        type: array
      by_period:
        items:
          $ref: '#/definitions/model.StatItem'
        type: array
      by_type:
        items:
          $ref: '#/definitions/model.StatItem'
        type: array
      top_students:
        items:
          $ref: '#/definitions/model.TopStudent'
        type: array
      total_achievements:
        type: integer
    type: object
  model.StudentDetailResponse:
    properties:
      advisor_name:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      program_study:
        type: string
      student_id:
        type: string
    type: object
  model.StudentListResponse:
    properties:
      advisor_name:
        type: string
      full_name:
        type: string
      id:
        type: string
      program_study:
        type: string
      student_id:
        type: string
    type: object
  model.StudentStatsResponse:
    properties:
      stats:
        $ref: '#/definitions/model.StatsResponse'
      student_profile:
        $ref: '#/definitions/model.TopStudent'
    type: object
  model.SuccessMessageResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  model.SwaggerAchievementHistoryResponse:
    properties:
      data:
        items: {}
        type: array
      success:
        type: boolean
    type: object
  model.SwaggerAchievementListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.AchievementResponse'
        type: array
      meta:
        $ref: '#/definitions/model.MetaInfo'
      success:
        type: boolean
    type: object
  model.SwaggerAchievementResponse:
    properties:
      data:
        $ref: '#/definitions/model.AchievementResponse'
      success:
        type: boolean
    type: object
  model.SwaggerAdviseesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.StudentListResponse'
        type: array
      success:
        type: boolean
    type: object
  model.SwaggerAttachmentResponse:
    properties:
      data:
        $ref: '#/definitions/model.AttachmentResponse'
      success:
        type: boolean
    type: object
  model.SwaggerLecturerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.LecturerListResponse'
        type: array
      meta:
        $ref: '#/definitions/model.MetaInfo'
      success:
        type: boolean
    type: object
  model.SwaggerRefreshResponse:
    properties:
      data:
        $ref: '#/definitions/model.RefreshTokenResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  model.SwaggerStatsResponse:
    properties:
      data:
        $ref: '#/definitions/model.StatsResponse'
      success:
        type: boolean
    type: object
  model.SwaggerStudentDetailResponse:
    properties:
      data:
        $ref: '#/definitions/model.StudentDetailResponse'
      success:
        type: boolean
    type: object
  model.SwaggerStudentListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.StudentListResponse'
        type: array
      meta:
        $ref: '#/definitions/model.MetaInfo'
      success:
        type: boolean
    type: object
  model.SwaggerStudentStatsResponse:
    properties:
      data:
        $ref: '#/definitions/model.StudentStatsResponse'
      success:
        type: boolean
    type: object
  model.SwaggerUserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.UserResponse'
        type: array
      meta:
        $ref: '#/definitions/model.MetaInfo'
      success:
        type: boolean
    type: object
  model.SwaggerUserResponse:
    properties:
      data:
        $ref: '#/definitions/model.UserResponse'
      success:
        type: boolean
    type: object
  model.TopStudent:
    properties:
      program_study:
        type: string
      student_id:
        type: string
      student_name:
        type: string
      total_achievements:
        type: integer
      total_points:
        type: integer
    type: object
  model.UpdateAchievementRequest:
    properties:
      achievement_type:
        enum:
        - academic
        - competition
        - organization
        - publication
        - certification
        - other
        type: string
      competition_details:
        $ref: '#/definitions/model.CompetitionRequest'
      description:
        type: string
      event_date:
        type: string
      organization_details:
        $ref: '#/definitions/model.OrganizationRequest'
      publication_details:
        $ref: '#/definitions/model.PublicationRequest'
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  model.UpdateUserRequest:
